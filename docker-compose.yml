# TeacherDesk — NAS deployment behind a Cloudflare Tunnel.
#
# No `ports:` are published anywhere on purpose: nothing on the NAS is reachable
# from the LAN or the internet directly. The only egress is cloudflared's
# outbound connection to Cloudflare, which then serves
# https://t-desk.buildlink.cc.
#
# Traffic path:
#   browser -> Cloudflare edge -> tunnel -> web (nginx) -> /api -> api -> db
#
# Images are pulled from Alibaba Cloud ACR (crpi-7l6kwk12l9aqux5u.cn-hangzhou.
# personal.cr.aliyuncs.com), not ghcr.io — GHCR pulls from this NAS's network
# (mainland China) would reliably stall on one blob layer. CI (container.yml)
# publishes to both registries; only ACR is used here. The `teacherdesk-api`/
# `teacherdesk-web` repos there are private, so `docker login` to that
# registry once on this host before the first `docker compose pull`:
#   docker login crpi-7l6kwk12l9aqux5u.cn-hangzhou.personal.cr.aliyuncs.com

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teacherdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-teacherdesk}
      # Deterministic collation so ORDER BY on Chinese names is stable.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teacherdesk} -d ${POSTGRES_DB:-teacherdesk}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot: applies the Prisma schema and the partial indexes, then exits.
  # The api service waits for it to finish successfully before starting.
  migrate:
    # Reuse the api image rather than declaring a second build of the same
    # context: two build entries produce two independently-cached images, which
    # silently drift apart when only one is rebuilt.
    image: crpi-7l6kwk12l9aqux5u.cn-hangzhou.personal.cr.aliyuncs.com/lhxone/teacherdesk-api:${TEACHERDESK_IMAGE_TAG:-latest}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-teacherdesk}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-teacherdesk}?schema=public
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    # Invoke the vendored CLI directly. `npx prisma` would try to fetch the
    # package from the network (and fail, unprivileged) instead of using the
    # copy already in node_modules.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ./node_modules/.bin/prisma migrate deploy
        echo "migrations complete"

  api:
    image: crpi-7l6kwk12l9aqux5u.cn-hangzhou.personal.cr.aliyuncs.com/lhxone/teacherdesk-api:${TEACHERDESK_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-teacherdesk}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-teacherdesk}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      # Same-origin deployment: nginx proxies /api, so the browser never makes
      # a cross-origin request. Kept explicit as defence in depth.
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-https://t-desk.buildlink.cc}
      # Web Push. Leave the VAPID keys empty to disable push reminders.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@teacherdesk.app}
      LOCAL_TZ_OFFSET_MINUTES: ${LOCAL_TZ_OFFSET_MINUTES:-480}
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    image: crpi-7l6kwk12l9aqux5u.cn-hangzhou.personal.cr.aliyuncs.com/lhxone/teacherdesk-web:${TEACHERDESK_IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      - api

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Outbound-only: cloudflared dials Cloudflare, nothing dials in.
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    environment:
      # Force TCP (HTTP/2) instead of the QUIC/UDP default. On this NAS's
      # network, outbound UDP to Cloudflare's edge times out intermittently
      # ("failed to dial to edge with quic: timeout: no recent network
      # activity"), which flaps the tunnel and makes logins fail sporadically
      # even though the api/web containers are healthy. TCP/443 outbound is
      # reliable here, so pin to it.
      TUNNEL_TRANSPORT_PROTOCOL: http2
    networks:
      - internal
    depends_on:
      - web

networks:
  internal:
    driver: bridge

volumes:
  db-data:
