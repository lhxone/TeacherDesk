server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare already gzips at the edge, but compressing here helps when the
    # tunnel serves an uncompressed origin response.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # The real client IP arrives via the tunnel, not the socket.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 0.0.0.0/0;

    client_max_body_size 4m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Same-origin API proxy: the browser only ever talks to this host, so no
    # CORS preflight and no separate API hostname to expose.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # Hashed build assets are immutable; cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The service worker must never be cached, or clients pin an old build.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
