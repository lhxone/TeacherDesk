name: Test and publish containers

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: teacherdesk
          POSTGRES_PASSWORD: teacherdesk_test
          POSTGRES_DB: teacherdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teacherdesk -d teacherdesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://teacherdesk:teacherdesk_test@localhost:5432/teacherdesk_test?schema=public
      JWT_SECRET: ci-only-not-a-production-secret
      NODE_ENV: test
      # registerUser() test helper needs this to bootstrap its seed account
      # (see server/tests/helpers.ts) — matches the local server/.env.test.
      INITIAL_INVITE_CODE: ci-bootstrap
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run build

  test-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  publish:
    needs: [test-server, test-web]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: ./server
            image: teacherdesk-api
          - component: web
            context: ./web
            image: teacherdesk-web
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Mirrors every image to Alibaba Cloud ACR too: GHCR is often slow or
      # outright stalls (a single blob layer hanging indefinitely) when pulled
      # from mainland China, which is where the NAS this app deploys to lives.
      - name: Log in to Alibaba Cloud ACR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: crpi-7l6kwk12l9aqux5u.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
            crpi-7l6kwk12l9aqux5u.cn-hangzhou.personal.cr.aliyuncs.com/lhxone/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-
      - name: Build and optionally publish
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          # amd64 only: QEMU-emulated arm64 builds of native dependencies
          # (bcryptjs) made this job take 20-60+ minutes instead of ~3-4.
          # Add arm64 back to `platforms` if a native arm64 runner or an
          # arm64 deployment target becomes available.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Only web/ reads this (see web/Dockerfile) — harmless no-op arg
          # for the api build, which ignores unrecognised build args.
          build-args: |
            GIT_COMMIT_HASH=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          # Alibaba Cloud ACR rejects the provenance/SBOM attestation manifest
          # buildx otherwise attaches ("denied: unknown manifest class for
          # application/vnd.oci.empty.v1+json") — GHCR accepts it fine, but
          # since this build now pushes to both registries in one step, drop
          # both attestations so the multi-registry push succeeds everywhere.
          provenance: false
          sbom: false
